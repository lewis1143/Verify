<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified - PadelPoint</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #305CDE 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: scaleIn 0.5s ease-out 0.2s both;
        }
        
        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }
        
        .checkmark {
            width: 40px;
            height: 40px;
            stroke: white;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 12px;
        }
        
        p {
            font-size: 16px;
            color: #6B7280;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        
        .app-button {
            display: inline-block;
            background: linear-gradient(135deg, #305CDE 0%, #1e3a8a 100%);
            color: white;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(48, 92, 222, 0.3);
        }
        
        .app-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(48, 92, 222, 0.4);
        }
        
        .app-button:active {
            transform: translateY(0);
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #305CDE 0%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">PadelPoint</div>
        <div class="success-icon">
            <svg class="checkmark" viewBox="0 0 24 24">
                <path d="M5 13l4 4L19 7" stroke-dasharray="24" stroke-dashoffset="24" style="animation: draw 0.6s ease-out 0.5s forwards;" />
            </svg>
        </div>
        <h1>Email Verified! ✅</h1>
        <p>Your email address has been successfully verified. You can now return to the PadelPoint app and continue with your account setup.</p>
        <a href="padelpoint://email-verified" class="app-button">Return to App</a>
    </div>
    
    <script>
        // Auto-redirect to app after 3 seconds if deep link doesn't work
        setTimeout(() => {
            window.location.href = 'padelpoint://email-verified';
        }, 3000);
        
        // Also try to open app immediately
        window.location.href = 'padelpoint://email-verified';
    </script>
</body>
</html>
